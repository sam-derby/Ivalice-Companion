[package]
name = "ivalice-companion"
version = "0.1.6"
description = "Local deterministic Ivalice Companion desktop shell"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ivalice-domain = { path = "../crates/domain" }
ivalice-infrastructure = { path = "../crates/infrastructure" }
ivalice-save-format = { path = "../crates/save-format" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
