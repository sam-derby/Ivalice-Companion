[package]
name = "ivalice-save-format"
version = "0.1.0"
description = "Bounded decoder and scoped gil editor for Ivalice Chronicles saves"
edition = "2021"
publish = false

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }
ivalice-domain = { path = "../domain" }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true
