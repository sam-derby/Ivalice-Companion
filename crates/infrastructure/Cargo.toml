[package]
name = "ivalice-infrastructure"
version = "0.1.0"
description = "Save acquisition, scoped edit publication, path discovery, and local configuration infrastructure"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
ivalice-domain = { path = "../domain" }
cap-std = "=4.0.3"
dirs = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
winsafe = { version = "=0.0.29", features = ["kernel"] }

[lints]
workspace = true
