name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SHOW_WIP: 'false'

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop-setup
        with:
          cache: validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run check:rust
      - name: Check AppImage resource access
        if: runner.os == 'Linux'
        run: bash .github/scripts/check-linux-fuse.sh

  packages:
    if: github.event_name != 'pull_request'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop-setup
        with:
          cache: packages
      - name: Restore reader artwork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/reader-art
          key:
            reader-art-${{ runner.os }}-${{
            hashFiles('.github/reader-art-source.json') }}
      - name: Build installer and portable
        run: npm run build
      - name: Verify packages
        run: node .github/scripts/release-package.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.platform }}
          path: target/release-assets/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30
