name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description:
          'Existing version tag; empty downloads the current main build'
        type: string
        default: ''
      create_draft:
        description: 'Prepare a draft release for the selected tag'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG:
    ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.build.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref:
            ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha
            }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Verify version and tag
        env:
          CREATE_DRAFT: ${{ inputs.create_draft || false }}
        run: |
          node --input-type=module -e "import { verifyVersion } from './.github/scripts/release-package.mjs'; if (process.env.CREATE_DRAFT === 'true' && !process.env.RELEASE_TAG) throw new Error('A release tag is required'); verifyVersion(process.cwd(), process.env.RELEASE_TAG)"
      - id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find verified packages
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node .github/scripts/release-source.mjs

  packages:
    needs: source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Download the tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id }}
          pattern: packages-*
          merge-multiple: true
          path: target/release-assets/combined
      - name: Verify all four checksums
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { verifyAssets } from './.github/scripts/release-publish.mjs'; const version = JSON.parse(fs.readFileSync('package.json')).version; const root = 'target/release-assets/combined'; fs.writeFileSync(root + '/SHA256SUMS.txt', verifyAssets(root, version));"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: target/release-assets/combined/*
          if-no-files-found: error
          retention-days: 30

  draft:
    if: github.event_name == 'push' || inputs.create_draft
    needs: [source, packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      # Keep the publisher tied to the workflow, even when shipping an older tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .local/release-tools
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: target/release-assets/combined
      - name: Prepare the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .local/release-tools/.github/scripts/release-publish.mjs
